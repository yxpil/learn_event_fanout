<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fan-out sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="30" y="20" width="120" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="90" y="41" text-anchor="middle" fill="#92400e">order svc</text>
    <rect x="200" y="20" width="120" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="260" y="41" text-anchor="middle" fill="#1d4ed8">event bus</text>
    <rect x="380" y="20" width="120" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="440" y="41" text-anchor="middle" fill="#15803d">notification</text>
    <rect x="540" y="20" width="120" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="600" y="41" text-anchor="middle" fill="#15803d">search</text>
    <rect x="700" y="20" width="120" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="760" y="41" text-anchor="middle" fill="#15803d">loyalty</text>
    <rect x="860" y="20" width="110" height="32" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="915" y="41" text-anchor="middle" fill="#b91c1c">inventory</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="90" y1="52" x2="90" y2="450"/>
    <line x1="260" y1="52" x2="260" y2="450"/>
    <line x1="440" y1="52" x2="440" y2="450"/>
    <line x1="600" y1="52" x2="600" y2="450"/>
    <line x1="760" y1="52" x2="760" y2="450"/>
    <line x1="915" y1="52" x2="915" y2="450"/>
  </g>

  <line x1="90" y1="80" x2="255" y2="80" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="172" y="74" text-anchor="middle" font-size="11.5" fill="#1e40af">publish OrderCreated</text>

  <!-- fan-out -->
  <line x1="260" y1="110" x2="435" y2="110" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="260" y1="135" x2="595" y2="135" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="260" y1="160" x2="755" y2="160" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="260" y1="185" x2="910" y2="185" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="580" y="100" text-anchor="middle" font-size="11" fill="#64748b">fan-out: each pipeline runs independently</text>

  <!-- inventory stops -->
  <line x1="915" y1="215" x2="915" y2="245" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="915" y="262" text-anchor="middle" font-size="11" fill="#b91c1c">STOP (bad qty)</text>
  <text x="915" y="280" text-anchor="middle" font-size="10.5" fill="#b91c1c">others unaffected</text>

  <text x="500" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Result</text>
  <text x="500" y="368" text-anchor="middle" font-size="11.5" fill="#334155">notification done · search done · loyalty done · inventory stopped</text>
  <text x="500" y="392" text-anchor="middle" font-size="11.5" fill="#334155">One event, many pipelines, failure isolated per pipeline.</text>
</svg>
</body>
</html>
