<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event fan-out star architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- event bus center -->
  <rect x="380" y="180" width="240" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Event Bus</text>
  <text x="500" y="234" text-anchor="middle" font-size="11.5" fill="#475569">publish OrderCreated</text>
  <text x="500" y="252" text-anchor="middle" font-size="11" fill="#64748b">fan-out to all subscribers</text>

  <!-- producer -->
  <rect x="380" y="40" width="240" height="50" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">order service</text>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#b45309">publishes event, doesn't know subscribers</text>
  <line x1="500" y1="90" x2="500" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4 pipelines radiating -->
  <g font-size="11.5">
    <rect x="60" y="330" width="190" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="155" y="354" text-anchor="middle" font-weight="700" fill="#15803d">notification</text>
    <text x="155" y="374" text-anchor="middle" fill="#166534">email_send → push_send</text>
    <text x="155" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">independent pipeline</text>

    <rect x="280" y="330" width="190" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="375" y="354" text-anchor="middle" font-weight="700" fill="#15803d">search_index</text>
    <text x="375" y="374" text-anchor="middle" fill="#166534">index_build → refresh</text>
    <text x="375" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">independent pipeline</text>

    <rect x="500" y="330" width="190" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="595" y="354" text-anchor="middle" font-weight="700" fill="#15803d">loyalty</text>
    <text x="595" y="374" text-anchor="middle" fill="#166534">points_add → level_check</text>
    <text x="595" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">independent pipeline</text>

    <rect x="720" y="330" width="210" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="825" y="354" text-anchor="middle" font-weight="700" fill="#b91c1c">inventory</text>
    <text x="825" y="374" text-anchor="middle" fill="#b91c1c">stock_deduct → low_stock_alert</text>
    <text x="825" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">stops on bad qty, others unaffected</text>
  </g>

  <!-- fan-out lines -->
  <line x1="430" y1="270" x2="155" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="470" y1="270" x2="375" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="530" y1="270" x2="595" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="570" y1="270" x2="825" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="500" y="20" text-anchor="middle" font-size="12" fill="#64748b">Star shape: one event in the center, pipelines radiate out independently.</text>
</svg>
</body>
</html>
